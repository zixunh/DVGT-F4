[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvgt2-foundation4d"
version = "0.1.0"
description = "Causal multi-camera perception and Gaussian mapping baseline on DVGT-2"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6", "einops>=0.8"]

[project.optional-dependencies]
dvgt2 = ["hydra-core>=1.3", "iopath>=0.1.10", "safetensors>=0.4", "diffusers>=0.30", "timm>=1.0", "psutil>=5.9", "huggingface-hub>=0.25"]
render = ["gsplat>=1.5,<2", "lpips>=0.1.4"]
pai = ["pyarrow>=19", "opencv-python-headless>=4.10", "DracoPy==1.7.0"]

[project.scripts]
dvgt2-f4d = "stream4d.cli:main"

[tool.setuptools.packages.find]
include = ["stream4d*"]
